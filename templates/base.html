<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ExamLock{% endblock %}</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --danger:#f87171; --ok:#34d399; --warn:#fbbf24; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  a { color:var(--accent); }
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1.5rem; background:#0b1220; border-bottom:1px solid #1e293b; }
  .topbar .brand { font-weight:800; font-size:1.25rem; letter-spacing:0.5px; }
  .topbar .brand span { color:var(--accent); }
  .container { max-width:1000px; margin:2rem auto; padding:0 1rem; }
  .card { background:var(--card); border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:1rem; }
  .btn { display:inline-block; padding:0.6rem 1.2rem; border-radius:8px; background:var(--accent); color:#04222e; font-weight:700; border:none; cursor:pointer; text-decoration:none; }
  .btn:hover { filter:brightness(1.1); }
  .btn.danger { background:var(--danger); color:#2a0a0a; }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:0.6rem 0.5rem; border-bottom:1px solid #334155; }
  th { color:var(--muted); font-size:0.85rem; text-transform:uppercase; }
  .badge { display:inline-block; padding:0.15rem 0.6rem; border-radius:999px; font-size:0.8rem; font-weight:700; }
  .badge.ok { background:#064e3b; color:var(--ok); }
  .badge.warn { background:#78350f; color:var(--warn); }
  .badge.bad { background:#7f1d1d; color:var(--danger); }
  .badge.info { background:#0c4a6e; color:var(--accent); }
  .muted { color:var(--muted); }
  input, select, textarea { width:100%; padding:0.6rem; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text); margin:0.25rem 0 0.75rem; }
  label { font-weight:600; }
  .flash { padding:0.75rem 1rem; border-radius:8px; margin-bottom:1rem; background:#7f1d1d; }
  h1,h2,h3 { margin-top:0; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="topbar">
  <div class="brand">Exam<span>Lock</span></div>
  <div>
    {% if user.is_authenticated %}
      <span class="muted">{{ user.email }} · {{ user.role }}</span>
      &nbsp; <a href="{% url 'web:logout' %}">Log out</a>
    {% endif %}
  </div>
</div>
<div class="container">
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
